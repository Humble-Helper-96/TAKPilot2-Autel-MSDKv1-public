# CI for TAKPilot2-Autel: compile, unit tests, lint on every push and PR.
#
# This gate catches compile errors and logic regressions in the pure-logic core. It does
# NOT decide whether a build is flight-worthy — that needs testing on real hardware.
# Releases stay manual on purpose.
#
# No secrets: without a keystore.properties the release build is unsigned, and the vendored
# SDK aars are committed in app/libs.
name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Assemble release
        run: ./gradlew :app:assembleRelease

      - name: Lint (vital)
        run: ./gradlew :app:lintVitalRelease

      - name: Keep test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/
